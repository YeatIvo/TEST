# Paper-Trading-Bot – läuft komplett auf GitHub, kein Laptop nötig.
# GitHub startet geplante Läufe teils Stunden zu spät – darum viele Termine; der Bot
# erkennt selbst, was fällig ist, und handelt pro Sitzung nur einmal.
name: Trading-Bot (Paper)

on:
  schedule:
    # Alle 2 Stunden (ungerade Minute, weil GitHub volle Stunden oft stark verspätet).
    # Der Bot entscheidet selbst (src/tick.py): Morgen-Check nach dem Open, Abend-Lauf
    # nach Börsenschluss – nachholbar bis kurz vor dem nächsten Open. Pro Tag nur einmal.
    - cron: "37 */2 * * *"
    - cron: "11 9 * * 6"      # Samstag: Wochen-Review
  workflow_dispatch:
    inputs:
      command:
        description: "Was soll der Bot tun?"
        required: true
        default: check-keys
        type: choice
        options:
          - check-keys      # Keys gesetzt? (zeigt nie Werte)
          - status          # was der Bot zu besitzen glaubt
          - dry-run         # heutigen Abend-Lauf berechnen, nichts senden
          - tick            # normaler geplanter Schritt jetzt ausführen
          - pause           # keine neuen Sleeves / kein neues Leihen
          - resume          # PAUSE aufheben
          - flatten         # ALLES zum nächsten Open verkaufen + PAUSE
          - review          # Review jetzt erstellen
          - rotate          # Sleeve tauschen (args: "<live-id> <bank-id>", erst prüfen; mit --apply ändern)
          - konto-1000      # Bericht Schatten-Konto 1000 CHF anzeigen
          - konto-2000      # Bericht Schatten-Konto 2000 CHF + 300/Monat (günstige ETFs)
          - shadow-init     # Schatten-Konto starten (args: --chf 1000 --start JJJJ-MM-TT --mirror GLD:354.02)
      args:
        description: "Zusatz (nur für rotate), z. B. sleeve:XLK:dip_rsi10_sma5 sleeve:XLY:dip_rsi10_sma5 --apply"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: trading-bot          # nie zwei Läufe gleichzeitig
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: trading-bot
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_PAPER: "true"                      # fest: nur Paper
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CMD: ${{ github.event_name == 'workflow_dispatch' && inputs.command || (github.event.schedule == '11 9 * * 6' && 'review' || 'tick') }}
      ARGS: ${{ inputs.args }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: trading-bot/requirements.txt
      - name: Pakete installieren
        run: pip install -q -r requirements.txt
      - name: Zustand laden
        run: bash ci/state.sh load
      - name: "Bot: ${{ env.CMD }}"
        run: |
          set -euo pipefail
          case "$CMD" in
            tick)        python -m src.tick; tail -n 5 logs/scheduler.log || true ;;
            check-keys)  python -m src.bot check-keys ;;
            status)      python -m src.bot status ;;
            dry-run)     python -m src.bot evening --dry-run ;;
            pause)       python -m src.bot pause ;;
            resume)      python -m src.bot resume ;;
            flatten)     python -m src.bot flatten ;;
            review)      python -m src.compare --alpaca && python -m src.review ;;
            rotate)      python -m src.data && python -m src.adapt rotate $ARGS ;;
            konto-1000)  python -m src.shadow report --chf 1000 ;;
            konto-2000)  python -m src.shadow report --chf 2000 ;;
            shadow-init) python -m src.shadow init $ARGS ;;
          esac
      - name: Zustand speichern
        if: always()
        run: bash ci/state.sh save
